name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.8.0
          enable-cache: false

      - name: Install the pinned Pi binary
        run: |
          scripts/install-ci-pi.sh "$RUNNER_TEMP/pi"
          echo "$RUNNER_TEMP/pi/pi" >> "$GITHUB_PATH"

      - name: Install the locked AgentShell runtime
        run: uv sync --project python --locked

      - name: Run Node tests
        run: env -u PI_AGENT_SHELL_CHILD npm test

      - name: Run Python tests
        run: env -u PI_AGENT_SHELL_CHILD npm run test:python

      - name: Verify the npm package
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify the release tag
        run: |
          package_version=$(node --print "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Publish the package
        run: npm publish
